<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e; --text:#e8e8f0;
    --muted:#4a4a6a; --accent:#c8ff00; --accent3:#7b61ff; --work-text:#60b4ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.35;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
  .container{max-width:960px;margin:0 auto;padding:40px 24px;}

  /* Header */
  .header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border);}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,9vw,76px);letter-spacing:.05em;line-height:.9;}
  .logo span{color:var(--accent);}
  .clock-block{text-align:right;}
  .live-time{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,6vw,56px);color:var(--accent);letter-spacing:.05em;line-height:1;}
  .live-date{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}

  /* Day theme + stats row */
  .meta-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .day-theme{font-size:11px;color:var(--accent3);letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border:1px solid rgba(123,97,255,.2);background:rgba(123,97,255,.06);}

  /* Stats bar */
  .stats-bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .stat-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:6px 14px;}
  .stat-pill-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .stat-pill-value{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.05em;color:var(--accent);}
  .stat-pill-value.warn{color:#ff9f43;}
  .stat-pill-sub{font-size:9px;color:var(--muted);letter-spacing:.08em;}
  .week-progress-wrap{height:3px;background:var(--border);margin-top:6px;margin-bottom:20px;overflow:hidden;}
  .week-progress-bar{height:100%;background:var(--accent);transition:width .6s ease;box-shadow:0 0 8px var(--accent);}

  /* Now block */
  .now-block{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:24px 28px;position:relative;overflow:hidden;margin-bottom:12px;animation:fadeUp .45s ease;}
  .now-block::after{content:'NOW';position:absolute;right:16px;top:14px;font-family:'Bebas Neue',sans-serif;font-size:46px;color:rgba(200,255,0,.05);letter-spacing:.1em;}
  .now-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:7px;}
  .now-emoji{font-size:26px;margin-bottom:5px;display:block;}
  .now-activity{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5.5vw,50px);letter-spacing:.04em;line-height:1;}
  .now-time{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.07em;}
  .progress-wrap{margin-top:14px;height:2px;background:var(--border);overflow:hidden;}
  .progress-bar{height:100%;background:var(--accent);transition:width 1s linear;box-shadow:0 0 6px var(--accent);}
  .progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;}

  /* Todo list inside NOW */
  .now-todos{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
  .now-todos-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .todo-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;user-select:none;}
  .todo-item:last-child{border-bottom:none;}
  .todo-check{width:16px;height:16px;border:1px solid var(--muted);border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .todo-item.done .todo-check{background:var(--accent);border-color:var(--accent);}
  .todo-item.done .todo-check::after{content:'✓';font-size:10px;color:#000;}
  .todo-text{font-size:12px;letter-spacing:.04em;transition:color .15s;line-height:1.5;}
  .todo-item.done .todo-text{color:var(--muted);text-decoration:line-through;}
  .todo-link{color:var(--accent3);text-decoration:none;border-bottom:1px solid rgba(123,97,255,.3);}
  .todo-link:hover{color:var(--accent);}
  .block-stat{font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.08em;}
  .block-stat span{color:var(--accent);}

  /* Divider & section */
  .divider{height:1px;background:var(--border);margin:26px 0;}
  .section-title{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

  /* Week grid */
  .schedule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;}
  .day-card{background:var(--surface);border:1px solid var(--border);padding:16px;transition:border-color .2s;}
  .day-card.today{border-color:rgba(200,255,0,.28);}
  .day-card:hover{border-color:var(--muted);}
  .day-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.05em;margin-bottom:2px;color:var(--muted);}
  .day-card.today .day-name{color:var(--accent);}
  .day-theme-small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent3);margin-bottom:6px;opacity:.7;}
  .day-completion{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;}
  .day-completion span{color:var(--accent);}
  .mini-progress{height:2px;background:var(--border);margin-bottom:10px;overflow:hidden;}
  .mini-progress-bar{height:100%;background:var(--accent);transition:width .4s ease;}
  .day-slot{display:flex;gap:7px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:10px;}
  .day-slot:last-child{border-bottom:none;}
  .day-slot-time{color:var(--muted);font-size:9px;min-width:76px;letter-spacing:.04em;}
  .day-slot-name{color:var(--text);letter-spacing:.04em;}
  .day-slot-name.accent{color:var(--accent);}
  .day-slot-name.work{color:var(--work-text);}
  .day-slot-name.sport{color:#ff9f43;}
  .day-slot-name.muted{color:var(--muted);}

  /* Leftovers — full-width rows */
  .leftover-row{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent3);padding:16px 20px;margin-bottom:8px;display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .leftover-row.general{border-left-color:var(--accent);}
  .leftover-meta{min-width:140px;flex-shrink:0;}
  .leftover-day{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;color:var(--muted);line-height:1;}
  .leftover-row.general .leftover-day{color:var(--accent);}
  .leftover-slot{font-size:9px;color:var(--accent3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}
  .leftover-row.general .leftover-slot{color:var(--accent);}
  .leftover-items{flex:1;display:flex;flex-direction:column;gap:0;}

  .footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:680px){
    .header{flex-direction:column;align-items:flex-start;gap:12px;}
    .clock-block{text-align:left;}
    .leftover-row{flex-direction:column;gap:10px;}
    .leftover-meta{min-width:unset;}
  }
</style>
</head>

// ─── State ────────────────────────────────────────────────────────────────────
const STORE_KEY = 'planner_todos_v2';
let STATE = [];   // loaded from todos.json + merged with localStorage

async function initState() {
  let template = [];
  try {
    const res = await fetch('./todos.json');
    template = await res.json();
  } catch(e) {
    console.warn('Could not load todos.json, using empty state');
    template = [];
  }

  // Load saved completion states
  let saved = {};
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) saved = JSON.parse(raw); // { id: boolean }
  } catch(e) {}

  // Deep clone template and apply saved completions
  STATE = JSON.parse(JSON.stringify(template));
  STATE.forEach(d => d.tasks.forEach(t =>
    t.items && t.items.forEach(i => {
      if (saved[i.id] !== undefined) i.completed = saved[i.id];
    })
  ));
}

function saveState() {
  const map = {};
  STATE.forEach(d => d.tasks.forEach(t =>
    t.items && t.items.forEach(i => { map[i.id] = i.completed; })
  ));
  try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch(e) {}
}

// ─── Calculations ─────────────────────────────────────────────────────────────
function calcStats(dayName) {
  // Today's tasks
  const todayData = STATE.find(d => d.day === dayName);
  let todayDone=0, todayTotal=0;
  if (todayData) todayData.tasks.forEach(t =>
    t.items && t.items.forEach(i => { todayTotal++; if(i.completed) todayDone++; })
  );

  // Week total (Mon-Sun, excluding General)
  let weekDone=0, weekTotal=0;
  STATE.forEach(d => {
    if(d.day==='General') return;
    d.tasks.forEach(t => t.items && t.items.forEach(i => {
      weekTotal++; if(i.completed) weekDone++;
    }));
  });

  // Leftovers count
  const jsDay = new Date().getDay();
  const todayIdx = jsDay===0 ? 6 : jsDay-1;
  let leftCount=0;
  STATE.forEach(d => {
    if(d.day==='General'){
      d.tasks.forEach(t => t.items && t.items.forEach(i => { if(!i.completed) leftCount++; }));
      return;
    }
    const di = DAY_ORDER.indexOf(d.day);
    if(di===-1||di>=todayIdx) return;
    d.tasks.forEach(t => t.items && t.items.forEach(i => { if(!i.completed) leftCount++; }));
  });

  return {todayDone,todayTotal,weekDone,weekTotal,leftCount};
}

function calcBlockStats(dayName, slotLabel) {
  const task = matchTasks(dayName, slotLabel);
  if(!task||!task.items) return null;
  const done  = task.items.filter(i=>i.completed).length;
  const total = task.items.length;
  return {done,total,pct:total?Math.round(done/total*100):0};
}

function calcDayStats(dayName) {
  const d = STATE.find(x=>x.day===dayName);
  if(!d||!d.tasks.length) return null;
  let done=0,total=0;
  d.tasks.forEach(t=>t.items&&t.items.forEach(i=>{total++;if(i.completed)done++;}));
  return {done,total,pct:total?Math.round(done/total*100):0};
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function jsDay2key(d){return d===0?7:d;}
function t2m(h,m){return h*60+m;}
function m2s(mins){const h=Math.floor(mins/60)%24,m=mins%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
function fmt2(n){return String(n).padStart(2,'0');}

function getCurSlot(dk,nowM){
  const slots=WEEK[dk].slots;
  for(const sl of slots){const s=t2m(...sl.s),e=t2m(...sl.e);if(e===0)continue;if(s<e&&nowM>=s&&nowM<e)return sl;}
  return slots[0];
}

function matchTasks(dayName, slotLabel) {
  const dayData = STATE.find(d=>d.day===dayName);
  if(!dayData||!dayData.tasks.length) return null;
  const lbl = slotLabel.toLowerCase().replace(/\s+/g,'');
  return dayData.tasks.find(t=>{
    const tl=t.title.toLowerCase().replace(/\s+/g,'');
    return lbl.includes(tl)||tl.includes(lbl);
  })||null;
}

function todoItemHTML(item) {
  const nameHtml = item.url
    ? `<a class="todo-link" href="${item.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${item.name}</a>`
    : item.name;
  return `<div class="todo-item${item.completed?' done':''}" onclick="toggleTodo('${item.id}')">
    <div class="todo-check"></div>
    <span class="todo-text">${nameHtml}</span>
  </div>`;
}

// ─── Renderers ────────────────────────────────────────────────────────────────
let currentSlotLabel='', currentDayName='';

function renderStats() {
  const s = calcStats(currentDayName);
  const todayPct = s.todayTotal ? Math.round(s.todayDone/s.todayTotal*100) : 0;
  const weekPct  = s.weekTotal  ? Math.round(s.weekDone /s.weekTotal *100) : 0;

  document.getElementById('stat-today-val').textContent = `${todayPct}%`;
  document.getElementById('stat-today-sub').textContent = `${s.todayDone}/${s.todayTotal} tasks`;
  document.getElementById('stat-week-val').textContent  = `${weekPct}%`;
  document.getElementById('stat-week-sub').textContent  = `${s.weekDone}/${s.weekTotal} done`;
  document.getElementById('stat-left-val').textContent  = s.leftCount;
  document.getElementById('week-progress-bar').style.width = weekPct+'%';
}

function renderNowTodos(slotLabel, dayName) {
  const wrap = document.getElementById('now-todos');
  const list = document.getElementById('now-todos-list');
  const bstat = document.getElementById('block-stat');
  const task = matchTasks(dayName, slotLabel);
  if(!task||!task.items||!task.items.length){ wrap.style.display='none'; return; }

  const bs = calcBlockStats(dayName, slotLabel);
  wrap.style.display='block';
  bstat.innerHTML = bs ? `<span>${bs.done}</span>/${bs.total} completed &nbsp;·&nbsp; <span>${bs.pct}%</span>` : '';
  list.innerHTML  = task.items.map(todoItemHTML).join('');
}

function renderLeftovers() {
  const jsDay  = new Date().getDay();
  const todayIdx = jsDay===0 ? 6 : jsDay-1;
  const container = document.getElementById('leftovers-list');
  let html = '';

  // General always first
  STATE.forEach(d => {
    if(d.day!=='General') return;
    d.tasks.forEach(task => {
      if(!task.items) return;
      const incomplete = task.items.filter(i=>!i.completed);
      if(!incomplete.length) return;
      html += `<div class="leftover-row general">
        <div class="leftover-meta">
          <div class="leftover-day">General</div>
          <div class="leftover-slot">${task.title}</div>
        </div>
        <div class="leftover-items">${incomplete.map(todoItemHTML).join('')}</div>
      </div>`;
    });
  });

  // Past days
  STATE.forEach(d => {
    if(d.day==='General') return;
    const di = DAY_ORDER.indexOf(d.day);
    if(di===-1||di>=todayIdx) return;
    d.tasks.forEach(task => {
      if(!task.items) return;
      const incomplete = task.items.filter(i=>!i.completed);
      if(!incomplete.length) return;
      html += `<div class="leftover-row">
        <div class="leftover-meta">
          <div class="leftover-day">${d.day}</div>
          <div class="leftover-slot">${task.title}</div>
        </div>
        <div class="leftover-items">${incomplete.map(todoItemHTML).join('')}</div>
      </div>`;
    });
  });

  container.innerHTML = html || '<p style="color:var(--muted);font-size:12px;letter-spacing:.08em;padding:12px 0">✓ All caught up — no leftovers.</p>';
}

function renderGrid(todayJsD){
  const grid=document.getElementById('schedule-grid');
  grid.innerHTML='';
  [1,2,3,4,5,6,7].forEach(dk=>{
    const jsD=dk===7?0:dk, isToday=jsD===todayJsD;
    const day=WEEK[dk], dayName=DAYS[jsD];
    const ds=calcDayStats(dayName);
    const card=document.createElement('div');
    card.className='day-card'+(isToday?' today':'');
    const visible=day.slots.filter(sl=>{
      const l=sl.label.toLowerCase();
      return!l.includes('sleep')&&!l.includes('wind down')&&!l.includes('wake up');
    });
    const statsHtml = ds
      ? `<div class="day-completion"><span>${ds.done}/${ds.total}</span> tasks · <span>${ds.pct}%</span></div>
         <div class="mini-progress"><div class="mini-progress-bar" style="width:${ds.pct}%"></div></div>`
      : '';
    card.innerHTML=`
      <div class="day-name">${DAYS_SHORT[jsD]}${isToday?' ◀':''}</div>
      <div class="day-theme-small">${day.theme}</div>
      ${statsHtml}
      ${visible.map(sl=>`<div class="day-slot">
        <span class="day-slot-time">${m2s(t2m(...sl.s))}–${m2s(t2m(...sl.e))}</span>
        <span class="day-slot-name ${sl.color}">${sl.emoji} ${sl.label}</span>
      </div>`).join('')}
    `;
    grid.appendChild(card);
  });
}

// ─── Clock loop ───────────────────────────────────────────────────────────────
let gridDone=false;

function update(){
  const now=new Date();
  const h=now.getHours(),mi=now.getMinutes(),s=now.getSeconds();
  const nowM=h*60+mi, jsD=now.getDay(), dk=jsDay2key(jsD);
  const dayName=DAYS[jsD];

  document.getElementById('live-time').textContent=`${fmt2(h)}:${fmt2(mi)}:${fmt2(s)}`;
  document.getElementById('live-date').textContent=`${dayName} · ${now.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}`;
  document.getElementById('day-theme').textContent=WEEK[dk].theme;

  const cur=getCurSlot(dk,nowM);
  document.getElementById('now-emoji').textContent=cur.emoji;
  document.getElementById('now-activity').textContent=cur.label;
  const ss=t2m(...cur.s),se=t2m(...cur.e);
  const pct=Math.min(100,Math.max(0,Math.round(((nowM-ss)/(se-ss))*100)));
  const rem=se-nowM;
  document.getElementById('now-time').textContent=`${m2s(ss)} – ${m2s(se)} · ${rem>=60?`${Math.floor(rem/60)}h ${rem%60}m`:rem+'m'} remaining`;
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-start').textContent=m2s(ss);
  document.getElementById('progress-end').textContent=m2s(se);
  document.getElementById('progress-pct').textContent=pct+'%';

  if(cur.label!==currentSlotLabel||dayName!==currentDayName){
    currentSlotLabel=cur.label; currentDayName=dayName;
    renderNowTodos(cur.label,dayName);
    renderStats();
    renderLeftovers();
  }

  if(!gridDone){renderGrid(jsD);gridDone=true;}
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
initState().then(()=>{
  update();
  setInterval(update,1000);
});
</script>
