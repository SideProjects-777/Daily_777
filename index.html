<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --text: #e8e8f0;
    --muted: #4a4a6a;
    --accent: #c8ff00;
    --accent3: #7b61ff;
    --work-text: #60b4ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .container { max-width: 940px; margin: 0 auto; padding: 40px 24px; }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(44px, 9vw, 76px);
    letter-spacing: 0.05em;
    line-height: 0.9;
  }

  .logo span { color: var(--accent); }

  .clock-block { text-align: right; }

  .live-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 6vw, 56px);
    color: var(--accent);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .live-date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .day-theme {
    font-size: 11px;
    color: var(--accent3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 24px;
    padding: 6px 14px;
    border: 1px solid rgba(123, 97, 255, 0.2);
    display: inline-block;
    background: rgba(123, 97, 255, 0.06);
  }

  .top-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 12px; }

  .now-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 22px 26px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.45s ease;
  }

  .now-block::after {
    content: 'NOW';
    position: absolute;
    right: 14px;
    top: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 46px;
    color: rgba(200, 255, 0, 0.05);
    letter-spacing: 0.1em;
  }

  .now-label {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 7px;
  }

  .now-emoji { font-size: 26px; margin-bottom: 5px; display: block; }

  .now-activity {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 5.5vw, 50px);
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .now-time { font-size: 11px; color: var(--muted); margin-top: 8px; letter-spacing: 0.07em; }
  .progress-wrap { margin-top: 14px; height: 2px; background: var(--border); overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); transition: width 1s linear; box-shadow: 0 0 6px var(--accent); }
  .progress-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

  .divider { height: 1px; background: var(--border); margin: 26px 0; }
  .section-title { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 9px; }

  .day-card { background: var(--surface); border: 1px solid var(--border); padding: 16px; transition: border-color 0.2s; }
  .day-card.today { border-color: rgba(200, 255, 0, 0.28); }
  .day-card:hover { border-color: var(--muted); }

  .day-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    color: var(--muted);
  }

  .day-card.today .day-name { color: var(--accent); }

  .day-theme-small {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .day-slot {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    font-size: 10px;
  }

  .day-slot:last-child { border-bottom: none; }
  .day-slot-time { color: var(--muted); font-size: 9px; min-width: 84px; letter-spacing: 0.04em; }
  .day-slot-name { color: var(--text); letter-spacing: 0.04em; }
  .day-slot-name.accent { color: var(--accent); }
  .day-slot-name.work { color: var(--work-text); }
  .day-slot-name.sport { color: #ff9f43; }
  .day-slot-name.muted { color: var(--muted); }

  .footer {
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 680px) {
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .clock-block { text-align: left; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">DAILY<br><span>PLANNER</span></div>
    <div class="clock-block">
      <div class="live-time" id="live-time">--:--:--</div>
      <div class="live-date" id="live-date">Loading...</div>
    </div>
  </header>

  <div class="day-theme" id="day-theme">Loading...</div>

  <div class="top-grid">
    <div class="now-block">
      <div class="now-label">▶ Right now</div>
      <span class="now-emoji" id="now-emoji">⏳</span>
      <div class="now-activity" id="now-activity">Loading...</div>
      <div class="now-time" id="now-time"></div>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>
      <div class="progress-label">
        <span id="progress-start">--:--</span>
        <span id="progress-pct">0%</span>
        <span id="progress-end">--:--</span>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="section-title">This week</div>
  <div class="schedule-grid" id="schedule-grid"></div>

  <footer class="footer">
    <span>Auto-updates every second</span>
    <span>Fixed weekly schedule</span>
  </footer>
</div>

      { s: [19, 0], e: [21, 0], label: 'Wind down', emoji: '🌙', color: 'muted' },

    ]
  },

function jsDay2key(day) { return day === 0 ? 7 : day; }
function t2m(h, m) { return h * 60 + m; }

function m2s(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function getCurSlot(dk, nowM) {
  const slots = WEEK[dk].slots;
  for (const sl of slots) {
    const s = t2m(...sl.s);
    const e = t2m(...sl.e);
    if (s < e && nowM >= s && nowM < e) return sl;
  }
  return slots[0];
}

function fmt2(n) { return String(n).padStart(2, '0'); }
let gridDone = false;

function update() {
  const now = new Date();
  const h = now.getHours();
  const mi = now.getMinutes();
  const s = now.getSeconds();
  const nowM = h * 60 + mi;
  const jsD = now.getDay();
  const dk = jsDay2key(jsD);

  document.getElementById('live-time').textContent = `${fmt2(h)}:${fmt2(mi)}:${fmt2(s)}`;
  document.getElementById('live-date').textContent = `${DAYS[jsD]} · ${now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;
  document.getElementById('day-theme').textContent = WEEK[dk].theme;

  const cur = getCurSlot(dk, nowM);
  document.getElementById('now-emoji').textContent = cur.emoji;
  document.getElementById('now-activity').textContent = cur.label;

  const ss = t2m(...cur.s);
  const se = t2m(...cur.e);
  const ratio = se > ss ? ((nowM - ss) / (se - ss)) : 0;
  const pct = Math.min(100, Math.max(0, Math.round(ratio * 100)));
  const rem = Math.max(0, se - nowM);

  document.getElementById('now-time').textContent = `${m2s(ss)} – ${m2s(se)} · ${rem >= 60 ? `${Math.floor(rem / 60)}h ${rem % 60}m` : rem + 'm'} remaining`;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-start').textContent = m2s(ss);
  document.getElementById('progress-end').textContent = m2s(se);
  document.getElementById('progress-pct').textContent = pct + '%';

  if (!gridDone) {
    renderGrid(jsD);
    gridDone = true;
  }
}

function renderGrid(todayJsD) {
  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = '';

  [1, 2, 3, 4, 5, 6, 7].forEach(dk => {
    const jsD = dk === 7 ? 0 : dk;
    const isToday = jsD === todayJsD;
    const day = WEEK[dk];
    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '');

    const visibleSlots = day.slots.filter(sl => {
      const lbl = sl.label.toLowerCase();
      return !lbl.includes('sleep') && !lbl.includes('wind down') && !lbl.includes('wake up');
    });

    const slotsHtml = visibleSlots.map(sl => `
      <div class="day-slot">
        <span class="day-slot-time">${m2s(t2m(...sl.s))}–${m2s(t2m(...sl.e))}</span>
        <span class="day-slot-name ${sl.color}">${sl.emoji} ${sl.label}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="day-name">${DAYS_SHORT[jsD]}${isToday ? ' ◀' : ''}</div>
      <div class="day-theme-small">${day.theme}</div>
      ${slotsHtml}
    `;

    grid.appendChild(card);
  });
}

update();
setInterval(update, 1000);
